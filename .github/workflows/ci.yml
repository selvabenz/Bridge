# Pull-request merge gate.
#
# release.yml stays exactly as it is: it builds and ships the Windows installer on a
# tag, and it is the only place the frozen sidecars and the real installer are
# exercised. What it is not is a merge gate -- it only runs on tags, and it never runs
# the Python suite at all. This workflow closes that gap: the analysis engine is the
# product, so its tests gate every PR.
#
# Job placement is deliberate:
#   frontend         -> ubuntu-latest. svelte-check and jsdom Vitest have no platform
#                       surface, and both were confirmed green locally on 2026-09-11
#                       (0 errors/0 warnings; 310 tests in 24 files).
#   rust             -> windows-latest. See the job for why: two sidecar.rs tests are
#                       #[cfg(windows)], and the crate has never been built on Linux by
#                       anything in this repo.
#   engine           -> windows-latest. Windows x64 is the only verified target and the
#                       only platform the product ships on; constraints-py312-windows.txt
#                       is the verified pin set release.yml installs, so the gate and the
#                       shipped artifact agree on versions; and the Logos/Paratext
#                       connector tests only ever execute here. The repo is public, so
#                       Actions minutes are free and the usual Linux cost argument does
#                       not apply.
#
#                       It is slow: 41m39s for 1063 tests, versus 17m13s for the same
#                       suite on Linux. Most of that gap is the autouse tmp_path fixture
#                       in conftest.py paid ~1060 times on a slower filesystem. If this
#                       becomes painful, measure with --durations=20 before trimming
#                       anything -- do not start deselecting tests to make the number
#                       look better.
#
# Nothing here builds an installer or a frozen sidecar. That stays in release.yml,
# where a 90-minute budget is appropriate; a gate that slow is one people learn to
# route around.
#
# Work on this repo goes directly onto main, so the `push` trigger is the one that
# matters most -- these jobs are the only automated gate there is. Path filters apply
# to push as well as to pull_request, deliberately: main takes every commit now, and
# a README edit should not cost a 20-minute engine run. The filters include ci.yml
# itself, so a change to the gate always re-runs everything the gate defines.

name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  # Nothing is ever cancelled here: every commit gets its own gate, and runs
  # in the same group wait their turn in FIFO order (#83).
  #
  # `cancel-in-progress` was only ever half the story. A *pending* run is
  # evicted whenever a newer run joins the group, regardless of that setting --
  # the default `queue: single` means "at most one run may be pending, and a
  # new one replaces it". That is what silently dropped a commit's gate on
  # 2026-09-14: three pushes to main inside twenty minutes, and the middle
  # one's run was discarded while still queued behind a 17-minute run. The
  # replacement run then skipped the jobs the evicted one would have run,
  # because its own path filter only sees its own diff -- so the engine
  # changes in that commit reached main having never been tested.
  #
  # `queue: max` allows up to 100 pending runs instead of one. It cannot be
  # combined with `cancel-in-progress: true` (workflow validation error), which
  # is fine: cancelling superseded PR runs is not worth losing a gate over.
  # release.yml deliberately keeps its own cancel-in-progress -- two triggers
  # fire for one tag there and the job is idempotent.
  group: ci-${{ github.workflow }}-${{ github.ref }}
  queue: max

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # Which parts of the repo did this PR touch? Everything below keys off this, so
  # a frontend-only PR doesn't pay for a Rust compile or a Windows runner.
  # ---------------------------------------------------------------------------
  changes:
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
      engine: ${{ steps.filter.outputs.engine }}
      rust: ${{ steps.filter.outputs.rust }}
      goldens: ${{ steps.filter.outputs.goldens }}
    steps:
      - uses: actions/checkout@v4
        with:
          # paths-filter diffs against the merge base; on a push to main it needs
          # real history rather than the default single-commit checkout.
          fetch-depth: 0
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            frontend:
              - 'src/**'
              - 'index.html'
              - 'package.json'
              - 'package-lock.json'
              - 'svelte.config.js'
              - 'vite.config.ts'
              - 'vitest.config.ts'
              - 'tsconfig.json'
              - 'tailwind.config.js'
              - 'postcss.config.js'
              # A change to the gate itself re-runs every job it defines. Without
              # this, a PR that edits ci.yml skips everything and merges green having
              # proved nothing about the workflow it just changed.
              - '.github/workflows/ci.yml'
            engine:
              - 'engine/**'
              # Not cosmetic. The engine suite reaches out of engine/ for both of
              # these: test_passage_semantic_foundation.py reads
              # schemas/fixtures/unicode-spans-v1.json, and four correction tests
              # import scripts/seed_review_fixture.py,
              # scripts/seed_correction_acceptance.py and
              # scripts/inspect_correction_application.py. Without these lines a PR
              # editing only a seed script would skip the suite it breaks.
              - 'schemas/**'
              - 'scripts/**'
              # The human-labelled Language QA benchmark: the gate below scores
              # the pack against these labels, so a change to them re-runs it.
              - 'benchmark/**'
              # A change to the gate itself re-runs every job it defines. Without
              # this, a PR that edits ci.yml skips everything and merges green having
              # proved nothing about the workflow it just changed.
              - '.github/workflows/ci.yml'
            rust:
              - 'src-tauri/**'
              # A change to the gate itself re-runs every job it defines. Without
              # this, a PR that edits ci.yml skips everything and merges green having
              # proved nothing about the workflow it just changed.
              - '.github/workflows/ci.yml'
            goldens:
              # The real location. There is no goldens/ directory and no
              # __snapshots__ anywhere in the repo -- the Stage 5 and Stage 6B
              # goldens are two JSON files that live with the tests that read them:
              #   engine/tests/fixtures/stage5-source-golden-v1.json
              #   engine/tests/fixtures/stage6b-location-golden-v1.json
              #
              # This guard keys on the filename, so a new golden MUST have "golden"
              # in its name to be protected. Kept deliberately looser than
              # '*-golden-*.json' so that e.g. stage7-golden.json is still caught.
              - 'engine/tests/fixtures/*golden*.json'

  # ---------------------------------------------------------------------------
  # Frontend: svelte-check + vitest. Fast, runs on most PRs.
  # ---------------------------------------------------------------------------
  frontend:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - name: svelte-check
        run: npm run check
      - name: Vitest
        run: npm run test

  # ---------------------------------------------------------------------------
  # Engine: the Python suite. This is the gap this workflow exists to close --
  # the analysis engine is the product and no workflow ran its tests before now.
  # ---------------------------------------------------------------------------
  engine:
    needs: changes
    if: needs.changes.outputs.engine == 'true'
    runs-on: windows-latest
    # Measured on this runner, run 34588971270: 41m39s for 1063 tests. That is ~2.4x
    # the 17m13s the same suite takes on Linux -- Windows pays for the autouse
    # tmp_path fixture on every one of ~1060 tests, and additionally runs the
    # PowerShell/cscript Logos and Paratext connector tests that skip on Linux.
    # 60 leaves real headroom over the measured number without hiding a hang.
    timeout-minutes: 60
    defaults:
      run:
        working-directory: engine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          # 3.12, not 3.13, to match release.yml: wildebeest-nlp cannot compile
          # under 3.13. The `wildebeest` extra is deliberately NOT installed here
          # (WildebeestAdapter falls back to its mock on its own), but keeping the
          # interpreter aligned with the release build means the gate and the
          # shipped artifact are not tested on different Pythons.
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            engine/pyproject.toml
            engine/constraints-py312-windows.txt
      - name: Install engine dependencies
        # There is no requirements*.txt in this repo. The engine is an editable
        # install from engine/pyproject.toml; constraints-py312-windows.txt pins the
        # verified Windows set and is what release.yml uses.
        run: |
          python -m pip install --upgrade pip
          pip install -c constraints-py312-windows.txt -e ".[dev]"
      # ~120MB, over GitHub's single-file push limit and not tracked by LFS, so it
      # lives as a release asset (see docs/DEVELOPER_SETUP.md and release.yml, which
      # does the same thing). Without it the Stage 3 tests in
      # test_semantic_mapping_stage3.py fail with SemanticMappingError: they construct
      # SemanticSourceRepository with an explicit path and so bypass the conftest
      # fixture that points everything else at a deliberately nonexistent DB.
      #
      # Confirmed by run 34588971270: 16 failed, 1047 passed without this step
      # (that count included test_semantic_corpus_discovery.py, removed in #101).
      - name: Download Stage 3 semantic-source DB
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          New-Item -ItemType Directory -Force -Path resources/semantic_mapping | Out-Null
          gh release download stage3-semantic-db-v0.3 `
            --repo ${{ github.repository }} `
            --pattern bridge_semantic_source_v0.3.sqlite `
            --dir resources/semantic_mapping `
            --clobber
          if ($LASTEXITCODE -ne 0) { throw "Stage 3 DB download failed" }

      - name: Run the Python suite
        # Both test roots are named (they are also `testpaths` in pyproject.toml) so
        # the command says exactly what is gated. PYTHONDONTWRITEBYTECODE keeps a
        # stale .pyc in the vendored trees from masking a real change; -p
        # no:cacheprovider keeps .pytest_cache out of a throwaway runner (locally it
        # is useful -- `pytest --lf` -- so it is not in addopts).
        #
        # Deliberately NOT `-n auto` here, although pytest-xdist is installed and is
        # the right default locally (~3x on a 10-core laptop). Measured on this
        # runner 2026-09-11 (#74 step 2): serial 35m18s (run 34598941837) vs
        # `-n auto` 54m51s (run 34603932107), same 1072 passed / 1 skipped. The
        # suite's cost is ~90 tests that each rebuild the Stage 5-8 pipeline for
        # ~60 s (#82); four workers on four shared vCPUs stretched every one of
        # those to ~155 s. Until #82 shares that setup, parallelism here is a loss.
        # Re-measure with `-n 2` on a nightly run (#74 step 3), not on the gate.
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: pytest tests/ greek_room_engine/tests/ -q -p no:cacheprovider

      - name: Language QA foreground latency gate
        # Layered-rules performance contract: while a Language QA pass runs,
        # the RPCs Language QA owns or runs beside must keep a p95 under the
        # budget, with the engine pinned to 2 cores. Those RPCs are ping,
        # verse.get, a Language QA verse.decide, languageQa.status and
        # languageQa.inline. It uses a synthetic 400-verse project, no
        # translator data. The shared write paths (another verse.decide,
        # verse.edit, project.open) are printed but not gated: they are over
        # budget with or without a scan (BUILD_LOG 2026-09-24, Phase 2), which
        # is not a Language QA cost.
        #
        # 300 ms HERE ONLY; the script's default stays 50 ms, which is what a
        # developer gets locally and what the contract actually means (#189).
        # Identical code measures 13.79 ms p95 on a dev machine and 112.27 ms on
        # this runner's two contended cores -- roughly 8x, for an environment no
        # translator uses. Raising the default instead would let a 20x local
        # regression through unnoticed.
        #
        # This budget went unevaluated from the gate being added until
        # 2026-09-30: the script died before its assertions on an unresolved
        # project path (#184), so the step reported neither pass nor fail. If it
        # starts failing at 300 ms, that is a real signal, not runner noise.
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python ../scripts/benchmark_language_qa.py --gate --cores 2 --p95-budget-ms 300

      - name: Language QA human-label accuracy gate
        # A Tamil reviewer's verdicts on the engine's own findings
        # (benchmark/human/2026-09-28). Inline requires >= 0.90 human precision
        # on >= 20 labelled findings; no rule may fall below
        # benchmark/human/baseline.json; no human-confirmed finding may be lost.
        # The labelled verses are committed beside the labels, so this needs no
        # IRV corpus. It replaces the AI-agreement gate as the inline decision,
        # which stays local and diagnostic (DECISIONS.md 2026-09-28). ~10 s.
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python ../scripts/language_qa_benchmark.py --human-labels ../benchmark/human --gate

  # ---------------------------------------------------------------------------
  # Rust / Tauri shell.
  # ---------------------------------------------------------------------------
  rust:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    # windows-latest, matching release.yml, for two reasons. The soft one: sidecar.rs
    # gates two of its tests behind #[cfg(windows)] (the taskkill process-tree kill),
    # so a Linux host silently compiles them out and gates less than it appears to.
    # The hard one: nothing in this project has ever built the Tauri crate on Linux --
    # release.yml only ever runs cargo on Windows -- so a Linux job here would be an
    # unverified guess about webkit2gtk availability shipped as a merge gate.
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Satisfy tauri-build's bundle inputs
        # tauri-build resolves every bundle.externalBin AND bundle.resources entry
        # inside its build script, so ANY cargo command -- `cargo test` included --
        # fails outright unless both exist. On a fresh checkout neither does: the
        # sidecars and src-tauri/resources are build output and .gitignore'd (only
        # binaries/README.txt is tracked). release.yml gets away without this step
        # because build-sidecars.ps1 runs first; this job deliberately skips that,
        # since building PyInstaller sidecars just to run unit tests would cost most
        # of the release budget.
        #
        # Confirmed the hard way: run 34587550433 cleared the externalBin check with
        # the stubs below and then failed on `resource path `resources` doesn't exist`.
        #
        # The binary stubs are never executed -- the unit tests in sidecar.rs are
        # pure logic and never spawn the engine. The
        # resources copy mirrors build-sidecars.ps1 exactly (engine/resources ->
        # src-tauri/resources) rather than faking a directory, so the build script
        # sees what it sees in a real build.
        shell: bash
        run: |
          triple="$(rustc -vV | sed -n 's/^host: //p')"
          case "$triple" in *windows*) ext=".exe" ;; *) ext="" ;; esac
          mkdir -p src-tauri/binaries
          for name in bridge-engine bridge-usfm-checker; do
            echo 'CI stub, never executed' > "src-tauri/binaries/${name}-${triple}${ext}"
          done
          cp -r engine/resources src-tauri/resources
          # The Language QA packs are a bundle.resources entry too (build-sidecars.ps1).
          cp -r engine/language_packs src-tauri/language_packs
          ls -l src-tauri/binaries
          ls src-tauri/resources
      - name: Rust tests
        working-directory: src-tauri
        run: cargo test

  # ---------------------------------------------------------------------------
  # Golden notice. Re-baselining a golden should be a deliberate act, never a side
  # effect of another change -- but there is no label to gate it on and no branch
  # protection to enforce a gate with, so this reports loudly and passes. It is a
  # prompt to look, not a wall.
  # ---------------------------------------------------------------------------
  golden-notice:
    needs: changes
    if: needs.changes.outputs.goldens == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Say which goldens moved
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          echo "::warning title=Golden baseline modified::This change edits Stage 5/6B golden baselines. Re-baselining should be deliberate and reviewed on its own -- if a golden is failing because of your change, that is a finding to report, not a file to regenerate."
          echo "Golden files touched:"
          git diff --name-only "$BASE" HEAD -- 'engine/tests/fixtures/*golden*.json' || true

  # ---------------------------------------------------------------------------
  # One required status check for branch protection to point at, so the protection
  # rule doesn't have to be edited every time a job is added or a path filter skips one.
  # ---------------------------------------------------------------------------
  ci-ok:
    if: always()
    # `changes` is in this list on purpose. Without it, a failure in the filter job
    # skips every downstream job, ci-ok sees nothing but "skipped", and the gate goes
    # green on a run that tested absolutely nothing.
    needs: [changes, frontend, engine, rust, golden-notice]
    runs-on: ubuntu-latest
    steps:
      - name: Fail if any required job failed
        run: |
          results="${{ join(needs.*.result, ' ') }}"
          echo "Job results: $results"
          case "$results" in
            *failure*|*cancelled*) echo "::error::A required check did not pass."; exit 1 ;;
            *) echo "All required checks passed or were skipped." ;;
          esac
