[project]
name = "bridge-engine"
version = "0.13.0"
description = "Bridge sidecar: tc_ai_bridge business logic + Greek Room QA, one protocol"
requires-python = ">=3.11"
dependencies = [
    # Required by the vendored Greek Room USFM structural checker and by
    # versification.py's vendored dependency. Floor raised to satisfy
    # uroman's own >=2024.5.15 requirement too (see below) — same package,
    # no version conflict, just the higher of the two floors.
    "regex>=2024.5.15",
    # Real PyPI package (unlike Wildebeest, "uroman" is not a name trap —
    # confirmed by installing it). By Ulf Hermjakob, USC/ISI, the same
    # author as Wildebeest and the vendored greek-room tools. No known
    # installability problem on any currently-supported Python version
    # (unlike wildebeest-nlp's Python 3.13 compile break), so this is a
    # hard dependency, not an optional extra with a mock fallback. See
    # docs/BUILD_LOG.md's Phase 5 section for the full
    # investigation, including a real license-classifier drift (PyPI/
    # upstream both say "Apache", the actual bundled LICENSE.txt is a
    # custom MIT-style license with its own mandatory attribution clause).
    "uroman>=1.3.1.1",
    # The one USFM parser (#91): the USFM Technical Committee's reference
    # implementation. Pure Python (rply + the regex above), MIT. Pinned exactly
    # because tc_ai_bridge/usfm_parser.py cuts verse text from its element
    # positions -- a release that shifts how it reports line/column would move
    # stored verse boundaries, and the parser refuses rather than guesses.
    "usfmtc==0.4.8",
    # "greekroom" left commented — OWL/UAlign not wired up yet (see
    # docs/BUILD_LOG.md's Phase 4-6 status). USFM, versification,
    # and Smart Edit Distance are all vendored separately instead — none
    # of the three is part of the published "greekroom" PyPI package.
    # "greekroom",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    # Process-based parallel test execution (`pytest -n auto`). Process-based
    # matters: engine/vendor/greekroom-versification/NOTICE.md records
    # catastrophic GIL contention under *thread* concurrency, which xdist
    # workers -- separate interpreters -- do not share. See #74.
    "pytest-xdist>=3.5",
    "pyinstaller>=6.0",
    # Reads indic-qa's reviewer workbooks (scripts/import_indic_qa_labels.py).
    # Tooling only: the engine never imports it, so the frozen build lacks it.
    "openpyxl>=3.1",
]
# Optional, not a hard dependency: the real PyPI package name is
# "wildebeest-nlp" (NOT "wildebeest" — that name belongs to an unrelated
# ShopRunner image-processing package). Pinned to the only release that
# exists (0.9.2). It cannot currently be installed under Python 3.13 — one
# of its docstrings contains a literal lone-surrogate escape that 3.13
# newly rejects at compile time (CPython issue #142411); confirmed still
# broken on upstream's GitHub HEAD too, not just this PyPI release. Works
# under 3.12. See docs/BUILD_LOG.md for the full investigation.
# WildebeestAdapter degrades to its mock automatically whether this extra
# is installed or not, so leaving it uninstalled is always safe.
wildebeest = [
    "wildebeest-nlp==0.9.2",
]

[tool.pytest.ini_options]
# rootdir is engine/. Both test roots are named so a bare `pytest` from engine/
# collects exactly what CI gates (#74). tests/ is a package (tests/__init__.py),
# so test modules import each other as `tests.<package>.<module>`.
testpaths = ["tests", "greek_room_engine/tests"]
# "." makes bridge_service / tc_ai_bridge / greek_room_engine importable from any
# cwd; ".." lets tests do `from scripts.seed_correction_acceptance import ...`;
# "../scripts" lets them do `import seed_correction_acceptance` -- the two
# spellings the correction acceptance tests already use.
pythonpath = [".", "..", "../scripts"]
# --strict-markers: a typo'd marker is an error, not a silently unfiltered test.
# --durations: keep the slow tail visible on every run so it cannot creep back.
addopts = "--strict-markers --durations=25 --durations-min=1.0"
# Windows pays for every tmp_path; keep only failed tests' directories around.
tmp_path_retention_policy = "failed"
tmp_path_retention_count = 1
markers = [
    "slow: a file whose tests average more than ~5 s (they rebuild the Stage 5-8 pipeline per test); `-m 'not slow'` is the inner-loop run",
    "subprocess: spawns a child process (the Python sidecar, PowerShell, the vendored USFM checker)",
    "desktop: needs Windows desktop tooling (PowerShell/cscript, Paratext or Logos helpers); skipif elsewhere",
    "resources: reads the bundled engine/resources trees (original-language packs, translationHelps)",
    "stage3db: needs the gitignored Stage 3 semantic-source SQLite (a release asset, see ci.yml)",
    "external: imports scripts/*.py or reads schemas/** from outside engine/",
    "packs: validates a shipped Language QA pack (tests/language_packs/test_packs.py); `-m 'not packs'` skips them",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["greek_room_engine*", "tc_ai_bridge*"]

[tool.setuptools]
py-modules = ["bridge_service", "check_jobs"]
